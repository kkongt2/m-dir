name: Release merged version

on:
  pull_request_target:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release merged version
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read and validate release version
        id: release
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath multipane_explorer.py -Raw
          $match = [regex]::Match(
            $source,
            '(?m)^APP_VERSION\s*=\s*["''](?<version>\d+\.\d+\.\d+)["'']'
          )
          if (-not $match.Success) {
            throw 'APP_VERSION must contain a semantic version such as 2.7.3.'
          }

          $version = $match.Groups['version'].Value
          $tag = "v$version"
          $targetSha = '${{ github.event.pull_request.merge_commit_sha }}'
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch repository tags.'
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($existingTag) {
            throw "Tag $tag already exists. Bump APP_VERSION before merging a new release."
          }

          $previousTag = git tag --merged $targetSha --sort=-version:refname |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Select-Object -First 1
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          if ($previousTag) {
            $commits = @(git log "$previousTag..$targetSha" --no-merges --pretty=format:'- `%h` %s')
          } else {
            $commits = @(git log $targetSha --no-merges --pretty=format:'- `%h` %s')
          }
          if ($LASTEXITCODE -ne 0 -or $commits.Count -eq 0) {
            throw 'Could not generate commit-only release notes.'
          }

          $commits | Set-Content -LiteralPath $notesPath -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_sha=$targetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm MultiPaneExplorer.spec

      - name: Create and push version tag
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $targetSha = '${{ steps.release.outputs.target_sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate $tag $targetSha --message "Release $tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create tag $tag."
          }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push tag $tag."
          }

      - name: Create GitHub Release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $notesPath = '${{ steps.release.outputs.notes_path }}'
          gh release create $tag 'dist/MultiPaneExplorer.exe#MultiPaneExplorer.exe' `
            --verify-tag `
            --title $tag `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create release $tag."
          }
